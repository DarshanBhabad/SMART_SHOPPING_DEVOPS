version: '3.8'

services:
  backend:
    build: ./backend
    container_name: smart-shopping-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_SUPABASE_URL=${SUPABASE_URL}
        - REACT_APP_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9mcXhrZmdoa3hweW9ibHdub3d2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NzkyMzksImV4cCI6MjEwOTE1NTIzOX0.-upJwdn8DiZsmxnZccW76YQmt_oDiP8v-vg0911eVno
        - REACT_APP_API_URL=/api
    container_name: smart-shopping-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
